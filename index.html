<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Betzy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #ffe3e8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #5d4347;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #main {
      position: relative;
      width: 1100px;
      height: 680px;
      background: #fdf0ee;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(230, 140, 155, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.8);
      overflow: hidden;
    }

    #text-container {
      position: absolute;
      left: 70px;
      top: 90px;
      width: 450px;
      z-index: 10;
      pointer-events: none;
    }

    #code {
      font-size: 19px;
      line-height: 29px;
      min-height: 220px;
    }

    .say-line {
      display: block;
      margin-bottom: 16px;
    }
    
    .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1s ease, transform 1s ease;
      margin-right: 5px;
    }

    .word.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #clock-box {
      margin-top: 35px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 2s ease, transform 2s ease;
      background: rgba(255, 255, 255, 0.85);
      padding: 16px 24px;
      border-radius: 14px;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      backdrop-filter: blur(4px);
    }

    #clock-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8b6b70;
      margin-bottom: 6px;
      font-weight: 600;
    }

    #clock {
      font-weight: 700;
      color: #a83248;
      font-size: 20px;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    #intro-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      background: #fdf0ee;
      transition: opacity 1.5s ease;
      cursor: pointer;
    }

    #intro-title {
      font-size: 40px;
      font-weight: 700;
      color: #a83248;
      margin-top: 20px;
      font-family: 'Georgia', serif;
      font-style: italic;
    }

    #click-prompt {
      margin-top: 15px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #b0707c;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="main">
    <div id="intro-overlay" onclick="startSequence()">
      <canvas id="intro-canvas" width="220" height="220"></canvas>
      <div id="intro-title">Flores para Betzy</div>
      <div id="click-prompt">Haz clic para comenzar</div>
    </div>

    <div id="text-container">
      <div id="code"></div>
      <div id="clock-box">
        <div id="clock-label">Nuestro amor comenzó hace...</div>
        <div id="clock">Cargando...</div>
      </div>
    </div>
    
    <canvas id="canvas" width="1100" height="680"></canvas>
  </div>

  <script>
    // Fecha exacta de aniversario
    const startDate = new Date(2025, 2, 21, 0, 0, 0); 

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const introCanvas = document.getElementById('intro-canvas');
    const introCtx = introCanvas.getContext('2d');

    let stage = 'intro';
    let transitionProgress = 0;
    
    let mainSunflower = {
      x: 550, y: 320, size: 50, speedY: 0, targetX: 550, targetY: 580
    };

    let branches = [];
    let sunflowers = [];
    let leaves = [];
    let particles = [];
    let fallingSunflowers = [];
    let heartOutlineProgress = 0;

    let treeOffset = { x: 0 };
    const startTreeX = 550;
    const endTreeX = 800;
    const treeY = 580;

    const poemLines = [
      "Flores Amarillas para el amor de mi vida:",
      "Hoy no te pude ver, pero eso no es motivo para no intentar darte un detalle.",
      "Si pudiera elegir un lugar seguro, sería a tu lado.",
      "Cuanto más tiempo estoy contigo, más te amo.",
      "--"
    ];

    let pulseAngle = 0;
    function drawIntro() {
      if (stage !== 'intro') return;
      introCtx.clearRect(0, 0, 220, 220);
      
      pulseAngle += 0.03;
      let scalePulse = 48 + Math.sin(pulseAngle) * 2;
      
      drawSunflower(introCtx, 110, 110, scalePulse, pulseAngle * 0.2, 1, "#FFD700");
      requestAnimationFrame(drawIntro);
    }
    drawIntro();

    function startSequence() {
      if (stage !== 'intro') return;
      const overlay = document.getElementById('intro-overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 1500);

      stage = 'falling';
      requestAnimationFrame(mainLoop);
    }

    function generateTreeStructure(centerX, startY) {
      branches = [];

      branches.push({
        type: 'trunk',
        x1: centerX, y1: startY,
        x2: centerX, y2: startY - 370,
        w1: 30, w2: 8,
        progress: 0,
        delay: 0
      });

      const branchSpecs = [
        { y: -100, endX: -80, endY: -40, cpX: -50, cpY: -10, w: 9, delay: 10 },
        { y: -140, endX: 90,  endY: -50, cpX: 60,  cpY: -15, w: 9, delay: 15 },
        { y: -190, endX: -105,endY: -60, cpX: -70, cpY: -25, w: 8, delay: 20 },
        { y: -220, endX: 110, endY: -65, cpX: 75,  cpY: -30, w: 8, delay: 25 },
        { y: -260, endX: -90, endY: -75, cpX: -60, cpY: -35, w: 7, delay: 30 },
        { y: -290, endX: 85,  endY: -75, cpX: 55,  cpY: -35, w: 7, delay: 35 },
        { y: -320, endX: -60, endY: -85, cpX: -35, cpY: -45, w: 5, delay: 40 },
        { y: -340, endX: 55,  endY: -90, cpX: 30,  cpY: -45, w: 5, delay: 45 },
        { y: -370, endX: -30, endY: -75, cpX: -15, cpY: -40, w: 3, delay: 50 },
        { y: -370, endX: 30,  endY: -75, cpX: 15,  cpY: -40, w: 3, delay: 50 }
      ];

      branchSpecs.forEach(b => {
        branches.push({
          type: 'branch',
          x1: centerX, y1: startY + b.y,
          x2: centerX + b.endX, y2: startY + b.y + b.endY,
          cpx: centerX + b.cpX, cpy: startY + b.y + b.cpY,
          w: b.w,
          progress: 0,
          delay: b.delay
        });
      });

      generateHeartElements(centerX, startY - 300);
    }

    function generateHeartElements(centerX, centerY) {
      sunflowers = [];
      leaves = [];
      particles = [];

      const totalSunflowers = 550; 
      const scale = 12.5;
      const yellowShades = ["#FFD700", "#FFC700", "#FFEB3B", "#FFB300"];

      for (let i = 0; i < totalSunflowers; i++) {
        let t = Math.random() * Math.PI * 2;
        let r = Math.sqrt(Math.random());
        
        let hx = 16 * Math.pow(Math.sin(t), 3);
        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

        let x = centerX + (hx * scale) * r;
        let y = centerY + (hy * scale) * r;

        let isRotating = Math.random() < 0.60;

        sunflowers.push({
          x: x,
          y: y,
          size: 0,
          targetSize: 10 + Math.random() * 4.5,
          rotation: Math.random() * Math.PI * 2,
          isRotating: isRotating,
          rotSpeed: isRotating ? (Math.random() < 0.5 ? 1 : -1) * (0.01 + Math.random() * 0.02) : 0,
          color: yellowShades[Math.floor(Math.random() * yellowShades.length)]
        });

        if (Math.random() < 0.35) {
          leaves.push({
            x: x + (-8 + Math.random() * 16),
            y: y + (-8 + Math.random() * 16),
            size: 6 + Math.random() * 6,
            angle: Math.random() * Math.PI * 2
          });
        }
      }

      for (let i = 0; i < 45; i++) {
        let t = Math.random() * Math.PI * 2;
        let hx = 16 * Math.pow(Math.sin(t), 3);
        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

        particles.push({
          x: centerX + (hx * scale) * (0.8 + Math.random() * 0.4),
          y: centerY + (hy * scale) * (0.8 + Math.random() * 0.4),
          radius: 1.5 + Math.random() * 2.5,
          alpha: Math.random(),
          speedAlpha: 0.01 + Math.random() * 0.02
        });
      }
    }

    function drawHeartOutline(centerX, centerY, progress, offsetX) {
      if (progress <= 0) return;
      ctx.save();
      ctx.beginPath();
      const scale = 12.5;
      const steps = 120;
      const maxSteps = Math.floor(steps * progress);

      for (let i = 0; i <= maxSteps; i++) {
        let t = (i / steps) * Math.PI * 2 - Math.PI / 2;
        let hx = 16 * Math.pow(Math.sin(t), 3);
        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        let x = centerX + hx * scale + offsetX;
        let y = centerY + hy * scale;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = "rgba(235, 175, 55, 0.55)";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 6]);
      ctx.shadowColor = "#ffb700";
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.restore();
    }

    function spawnBackgroundSunflower() {
      if (stage === 'text' || stage === 'petals_drop') {
        fallingSunflowers.push({
          x: 40 + Math.random() * 460,
          y: -20,
          size: 8 + Math.random() * 6,
          speedX: -0.2 + Math.random() * 0.4,
          speedY: 0.7 + Math.random() * 0.8,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: -0.02 + Math.random() * 0.04,
          opacity: 0.16
        });
      }
    }

    function mainLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.beginPath();
      ctx.moveTo(0, treeY);
      ctx.lineTo(canvas.width, treeY);
      ctx.strokeStyle = "#5a3a3a";
      ctx.lineWidth = 2;
      ctx.stroke();

      if (stage === 'falling') {
        mainSunflower.speedY += 0.18;
        mainSunflower.y += mainSunflower.speedY;

        if (mainSunflower.y >= mainSunflower.targetY - 10) {
          stage = 'growing';
          transitionProgress = 0;
          generateTreeStructure(startTreeX, treeY);
        } else {
          drawSunflower(ctx, mainSunflower.x, mainSunflower.y, mainSunflower.size);
        }
      }

      if (stage === 'moving') {
        transitionProgress += 0.016;
        treeOffset.x = (endTreeX - startTreeX) * easeInOutCubic(transitionProgress);
        if (transitionProgress >= 1) {
          stage = 'petals_drop';
          showTextAndClock();
        }
      } else if (stage === 'petals_drop' || stage === 'text') {
        treeOffset.x = endTreeX - startTreeX;
      }

      if (stage !== 'falling') {
        let allBranchesGrown = true;

        branches.forEach(b => {
          if (transitionProgress >= b.delay || stage !== 'growing') {
            if (b.progress < 1) {
              b.progress += 0.03;
              if (b.progress > 1) b.progress = 1;
              allBranchesGrown = false;
            }

            ctx.fillStyle = "#6d421e";
            ctx.strokeStyle = "#6d421e";
            ctx.lineCap = "round";

            if (b.type === 'trunk') {
              let currentY2 = b.y1 + (b.y2 - b.y1) * b.progress;
              let currentW2 = b.w1 + (b.w2 - b.w1) * b.progress;

              ctx.beginPath();
              ctx.moveTo(b.x1 - b.w1 / 2 + treeOffset.x, b.y1);
              ctx.lineTo(b.x1 + b.w1 / 2 + treeOffset.x, b.y1);
              ctx.lineTo(b.x1 + currentW2 / 2 + treeOffset.x, currentY2);
              ctx.lineTo(b.x1 - currentW2 / 2 + treeOffset.x, currentY2);
              ctx.closePath();
              ctx.fill();
            } else {
              let cx = b.x1 + (b.x2 - b.x1) * b.progress + treeOffset.x;
              let cy = b.y1 + (b.y2 - b.y1) * b.progress;
              let cpx = b.x1 + (b.cpx - b.x1) * b.progress + treeOffset.x;
              let cpy = b.y1 + (b.cpy - b.y1) * b.progress;

              ctx.beginPath();
              ctx.moveTo(b.x1 + treeOffset.x, b.y1);
              ctx.quadraticCurveTo(cpx, cpy, cx, cy);
              ctx.lineWidth = b.w;
              ctx.stroke();
            }
          } else {
            allBranchesGrown = false;
          }
        });

        if (stage === 'growing') {
          transitionProgress += 0.6;
          if (allBranchesGrown) {
            stage = 'heart_outline';
            heartOutlineProgress = 0;
          }
        }

        if (stage === 'heart_outline') {
          heartOutlineProgress += 0.03;
          drawHeartOutline(startTreeX, treeY - 300, heartOutlineProgress, treeOffset.x);
          if (heartOutlineProgress >= 1) {
            stage = 'blooming';
          }
        }

        if (stage === 'blooming' || stage === 'moving' || stage === 'petals_drop' || stage === 'text') {
          leaves.forEach(l => {
            ctx.save();
            ctx.translate(l.x + treeOffset.x, l.y);
            ctx.rotate(l.angle);
            ctx.fillStyle = "#4a7c59";
            ctx.beginPath();
            ctx.ellipse(0, 0, l.size, l.size * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });
        }

        let allBloomed = true;
        sunflowers.forEach((sf) => {
          if (stage === 'blooming' || stage === 'moving' || stage === 'petals_drop' || stage === 'text') {
            if (sf.size < sf.targetSize) {
              sf.size += 0.25;
              allBloomed = false;
            }
            
            if (sf.isRotating) {
              sf.rotation += sf.rotSpeed;
            }

            drawSunflower(ctx, sf.x + treeOffset.x, sf.y, sf.size, sf.rotation, 1, sf.color);
          } else {
            allBloomed = false;
          }
        });

        if (stage === 'blooming' || stage === 'moving' || stage === 'petals_drop' || stage === 'text') {
          particles.forEach(p => {
            p.alpha += p.speedAlpha;
            if (p.alpha > 1 || p.alpha < 0.1) p.speedAlpha *= -1;

            ctx.save();
            ctx.beginPath();
            ctx.arc(p.x + treeOffset.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 235, 150, ${p.alpha})`;
            ctx.shadowColor = "#ffe066";
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.restore();
          });
        }

        if (stage === 'blooming' && allBloomed) {
          stage = 'moving';
          transitionProgress = 0;
        }

        if (Math.random() < 0.16) {
          spawnBackgroundSunflower();
        }

        fallingSunflowers.forEach((p, idx) => {
          p.x += p.speedX;
          p.y += p.speedY;
          p.rotation += p.rotSpeed;

          if (p.y > 220) {
            p.opacity -= 0.002;
          }

          if (p.y > treeY || p.opacity <= 0) {
            fallingSunflowers.splice(idx, 1);
            return;
          }

          drawSunflower(ctx, p.x, p.y, p.size, p.rotation, p.opacity);
        });
      }

      requestAnimationFrame(mainLoop);
    }

    function showTextAndClock() {
      stage = 'text';
      document.getElementById('clock-box').style.opacity = '1';
      document.getElementById('clock-box').style.transform = 'translateY(0)';
      startClock();

      setTimeout(() => {
        const codeDiv = document.getElementById('code');
        poemLines.forEach((line) => {
          const lineSpan = document.createElement('span');
          lineSpan.className = 'say-line';
          
          line.split(' ').forEach((word) => {
            const wordSpan = document.createElement('span');
            wordSpan.className = 'word';
            wordSpan.textContent = word + ' ';
            lineSpan.appendChild(wordSpan);
          });
          
          codeDiv.appendChild(lineSpan);
        });

        const allWords = document.querySelectorAll('.word');
        allWords.forEach((w, i) => {
          setTimeout(() => w.classList.add('visible'), i * 220);
        });
      }, 800);
    }

    function drawSunflower(context, x, y, radius, rotation = 0, opacity = 1, mainColor = "#FFD700") {
      if (radius <= 0) return;
      context.save();
      context.translate(x, y);
      context.rotate(rotation);
      context.globalAlpha = opacity;

      const petalCount = 12;
      context.fillStyle = mainColor;
      for (let i = 0; i < petalCount; i++) {
        context.beginPath();
        context.rotate((Math.PI * 2) / petalCount);
        context.ellipse(0, radius, radius * 0.35, radius * 0.8, 0, 0, Math.PI * 2);
        context.fill();
      }

      context.fillStyle = "#FF9800";
      for (let i = 0; i < petalCount; i++) {
        context.beginPath();
        context.rotate((Math.PI * 2) / petalCount + 0.2);
        context.ellipse(0, radius * 0.7, radius * 0.25, radius * 0.5, 0, 0, Math.PI * 2);
        context.fill();
      }

      context.beginPath();
      context.arc(0, 0, radius * 0.52, 0, Math.PI * 2);
      context.fillStyle = "#3e2723";
      context.fill();

      context.beginPath();
      context.arc(0, 0, radius * 0.52, 0, Math.PI * 2);
      context.strokeStyle = "#5d4037";
      context.lineWidth = 1;
      context.stroke();

      context.restore();
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function startClock() {
      setInterval(() => {
        const now = new Date();
        const diff = now - startDate;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById('clock').innerHTML = 
          `${days}d <span style="font-weight: 300;">:</span> ${hours}h <span style="font-weight: 300;">:</span> ${minutes}m <span style="font-weight: 300;">:</span> ${seconds}s`;
      }, 1000);
    }
  </script>
</body>
</html>
